journeys:
  - id: J1
    name: "Plan with mixed tiers runs each task at its assigned tier"
    persona: "Engineer running an approved plan with 3 trivial / 4 standard / 3 heavy tasks"
    preconditions: "plan.md committed, tier YAML block on every task, repo clean"
    steps:
      - "Engineer invokes subagent-driven-development on plan.md"
      - "Orchestrator parses each task's tier block in order"
      - "For each trivial task: implementer dispatched, no other agents"
      - "For each standard task: implementer -> code-reviewer -> test-runner (existing tests)"
      - "For each heavy task: ITC -> implementer -> spec-reviewer -> code-reviewer -> test-runner"
    expected_outcome: >
      All 10 tasks complete. Agent dispatch log shows the right gates per task
      (trivial=1 agent, standard=3 agents, heavy=5+ agents). Total token cost
      ~50% of uniform-heavy baseline. plan.md unchanged (no escalations
      occurred, no Escalations ledger appended).
    feature_interactions: [plan-schema, tier-dispatch]
    priority: P0

  - id: J2
    name: "Planner classifies a fresh plan using the rubric"
    persona: "Engineer running writing-plans on a new spec containing tasks of varied complexity"
    preconditions: "spec exists; writing-plans skill loaded; rubric available in skill"
    steps:
      - "Planner reads each task description"
      - "Planner walks rubric top-down; selects first matching clause (trivial then standard then heavy)"
      - "Planner emits inline YAML block: tier + tier_reason quoting matched clause"
      - "Planner writes plan.md with all tier blocks present"
    expected_outcome: >
      Every task in plan.md has a `tier` field set to trivial, standard, or
      heavy. Every task has a `tier_reason` field that quotes a specific
      clause id from the rubric (e.g., "T1", "S2", "H3"). No task is left
      without a tier block.
    feature_interactions: [rubric-classification, plan-schema]
    priority: P0

  - id: J3
    name: "Planner defaults to heavy when no rubric clause matches"
    persona: "Engineer running writing-plans on a task that doesn't fit any rubric clause cleanly"
    preconditions: "spec contains an ambiguous task (e.g., 'investigate why X is slow')"
    steps:
      - "Planner walks rubric top-down for the ambiguous task"
      - "No trivial clause matches (T1-T4)"
      - "No standard clause matches (S1-S4)"
      - "No specific heavy clause (H1-H4) matches; planner falls through to H5"
    expected_outcome: >
      Task is tagged tier: heavy. tier_reason cites H5 explicitly
      (e.g., "H5: no clause matched cleanly, defaulting to heavy").
    feature_interactions: [rubric-classification, default-heavy-fallback, plan-schema]
    priority: P0

  - id: J4
    name: "Implementer escalates a misclassified trivial task"
    persona: "Engineer running plan with task T7 tagged trivial that turns out to need a new code file"
    preconditions: "plan.md task T7 has tier: trivial; T7 actually requires a new code file"
    steps:
      - "Orchestrator dispatches implementer for T7 at trivial tier"
      - "Implementer reads task, recognizes new code file is needed"
      - "Implementer halts before writing code, returns <ESCALATE> block (current_tier=trivial, requested_tier=standard)"
      - "Orchestrator validates escalation: requested_tier > current_tier, escalation_count < 1, current_tier != heavy"
      - "Orchestrator updates plan.md: T7.tier=standard, T7.tier_reason='escalated from trivial: ...', T7.escalation_count=1"
      - "Orchestrator re-dispatches T7 fresh at standard tier (no escalation note injected into prompt)"
      - "Standard flow runs: implementer -> code-reviewer -> test-runner"
    expected_outcome: >
      T7 ends in 'done' state with code committed via standard flow. plan.md
      reflects the new tier and reason for T7. End-of-run Escalations ledger
      lists T7 with its original tier, new tier, reason, and rubric clause
      violated. No code from the halted attempt remains in the working tree.
    feature_interactions: [tier-dispatch, escalation-protocol, plan-schema, escalation-ledger]
    priority: P0

  - id: J5
    name: "Per-task escalation cap blocks a second escalation"
    persona: "Engineer running plan where T9 already escalated trivial -> standard, and standard run also signals escalate"
    preconditions: "T9 escalation_count == 1 after a prior trivial -> standard escalation"
    steps:
      - "Orchestrator dispatches T9's standard-tier implementer"
      - "Implementer signals <ESCALATE> requesting heavy"
      - "Orchestrator checks per-task cap: T9.escalation_count == 1 (cap reached)"
      - "Orchestrator halts the plan, surfaces a clear message to user"
    expected_outcome: >
      Plan run halts at T9. User-facing message explains the per-task
      escalation cap was reached and points to the escalation ledger for
      context. plan.md and working tree are clean (no partial commits from
      the second halted attempt).
    feature_interactions: [escalation-protocol, escalation-ledger]
    priority: P0

  - id: J6
    name: "Heavy task signaling escalate halts the plan"
    persona: "Engineer running plan where a heavy task's implementer signals escalate"
    preconditions: "T3 tagged heavy; ITC negotiation completed; implementer halts with <ESCALATE>"
    steps:
      - "Orchestrator detects <ESCALATE> from a heavy-tier implementer"
      - "Validation fails: heavy is the top tier"
      - "Orchestrator halts plan, surfaces message to user explaining heavy cannot escalate"
    expected_outcome: >
      Plan halts. User-facing message explains heavy cannot escalate and
      suggests revising the task spec. plan.md is unchanged (no tier
      promotion, no ledger entry for an invalid escalation).
    feature_interactions: [escalation-protocol]
    priority: P1

  - id: J7
    name: "Task without a tier block is treated as heavy"
    persona: "Engineer hand-edited plan.md and forgot to add a tier block to T2"
    preconditions: "plan.md task T2 has no inline YAML tier block"
    steps:
      - "Orchestrator parses T2, finds no tier block"
      - "Orchestrator treats T2 as tier: heavy (fail-safe), logs a warning"
      - "Heavy flow runs"
    expected_outcome: >
      T2 completes via heavy flow. A warning is logged identifying T2 as
      missing a tier block. No crash, no halt.
    feature_interactions: [plan-schema, default-heavy-fallback, tier-dispatch]
    priority: P1

  - id: J8
    name: "User overrides planner's tier before execution"
    persona: "Engineer disagrees with planner; manually changes T5 from heavy to standard"
    preconditions: "plan.md committed by planner; engineer edits T5's tier to standard and updates tier_reason"
    steps:
      - "Engineer commits the edit"
      - "Engineer invokes subagent-driven-development"
      - "Orchestrator parses T5's tier block, reads tier=standard"
      - "Orchestrator dispatches T5 at standard tier (file is source of truth, no rubric re-validation)"
    expected_outcome: >
      T5 runs at standard tier per the user's override. The orchestrator does
      not re-validate against the rubric or warn about the change. Standard
      flow completes successfully.
    feature_interactions: [plan-schema, tier-dispatch]
    priority: P1

  - id: J9
    name: "End-of-run escalation ledger is rendered"
    persona: "Engineer reviewing plan.md after a run with two escalations"
    preconditions: "Plan completed; T7 escalated trivial -> standard; T11 escalated standard -> heavy"
    steps:
      - "Orchestrator finishes the last task in the plan"
      - "Orchestrator appends ## Escalations (2) section to plan.md with both entries"
    expected_outcome: >
      plan.md contains a `## Escalations (2)` block listing both tasks. Each
      entry shows the task id, original tier -> new tier, reason, and rubric
      clause violated.
    feature_interactions: [escalation-ledger, escalation-protocol]
    priority: P1

  - id: J10
    name: "Trivial task with malformed YAML block falls back to heavy"
    persona: "Engineer's plan.md has a YAML parse error in T4's tier block"
    preconditions: "T4 YAML block has a syntax error (e.g., missing colon, bad indentation)"
    steps:
      - "Orchestrator attempts to parse T4 tier block; YAML parser fails"
      - "Orchestrator logs the parse error, treats T4 as heavy (fail-safe)"
      - "Heavy flow runs"
    expected_outcome: >
      T4 completes via heavy flow. Parse error is surfaced to user as a
      warning identifying T4 and the parse failure. No crash, no halt.
    feature_interactions: [plan-schema, default-heavy-fallback]
    priority: P2
